<title>Museum Explorer Karlsruhe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;600&display=swap">
<style>
/* layout: sticky header, one column on phones, 1.6:1 stage/side grid on desktop; tokens from the Museum Explorer design system */
/* Museum Explorer Karlsruhe — generated from the design system tokens.json (light first, dark second). */
:root, [data-theme="light"] {
  --paper: #f4efe6; --surface: #fbf8f2; --bone: #e7dcc6; --line: #d9cfbd;
  --ink: #1d1a15; --ink-muted: #5f5747;
  --rust: #b4442a; --on-rust: #ffffff;
  --basalt: #2f3b3a; --on-basalt: #f4efe6;
  --amber: #d9a23b; --on-amber: #1d1a15;
  --focus: var(--rust);
  --shadow-sheet: 0 -8px 24px rgba(29,26,21,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14130f; --surface: #1d1b16; --bone: #2a261f; --line: #3a352c;
    --ink: #efe8dc; --ink-muted: #b3a892;
    --rust: #e2785a; --on-rust: #14130f;
    --basalt: #3d4e4c; --on-basalt: #f4efe6;
    --amber: #e6b552; --on-amber: #14130f;
    --shadow-sheet: 0 -8px 24px rgba(0,0,0,0.5);
  }
}
[data-theme="dark"] {
  --paper: #14130f; --surface: #1d1b16; --bone: #2a261f; --line: #3a352c;
  --ink: #efe8dc; --ink-muted: #b3a892;
  --rust: #e2785a; --on-rust: #14130f;
  --basalt: #3d4e4c; --on-basalt: #f4efe6;
  --amber: #e6b552; --on-amber: #14130f;
  --shadow-sheet: 0 -8px 24px rgba(0,0,0,0.5);
}
:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --radius-sm: 4px; --radius-md: 10px; --radius-lg: 20px; --radius-pill: 999px;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}


/* Museum Explorer Karlsruhe — component styles. Every value comes from tokens.css. */

.mek-root, .mek-root * { box-sizing: border-box; }
.mek-root { font-family: var(--font-sans); color: var(--ink); background: var(--paper); }

/* ---------- Button ---------- */
.mek-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--space-12); padding: 0 var(--space-6);
  font: 600 16px/1 var(--font-sans); border-radius: var(--radius-md);
  border: 1.5px solid transparent; cursor: pointer; text-decoration: none;
  transition: transform .12s ease, background-color .12s ease;
}
.mek-btn:active { transform: translateY(1px); }
.mek-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mek-btn svg { width: 20px; height: 20px; flex: none; }
.mek-btn--primary { background: var(--rust); color: var(--on-rust); }
.mek-btn--secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.mek-btn--ghost { background: transparent; color: var(--rust); padding: 0 var(--space-3); }
.mek-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Language toggle ---------- */
.mek-lang {
  display: inline-flex; padding: var(--space-1); gap: 2px;
  background: var(--bone); border-radius: var(--radius-pill);
}
.mek-lang button {
  min-width: 44px; min-height: 36px; padding: 0 var(--space-3);
  font: 600 13px/1 var(--font-mono); letter-spacing: .04em;
  color: var(--ink-muted); background: transparent; border: 0; border-radius: var(--radius-pill); cursor: pointer;
}
.mek-lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mek-lang button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- Tag ---------- */
.mek-tag {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 3px var(--space-2); border-radius: var(--radius-sm);
  font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase;
  background: var(--bone); color: var(--ink);
}
.mek-tag--era { background: var(--basalt); color: var(--on-basalt); }
.mek-tag--illustrative { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--amber); }
.mek-tag--illustrative::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.mek-tag--id { font-family: var(--font-mono); letter-spacing: .02em; text-transform: none; font-weight: 500; }

/* ---------- Fact grid ---------- */
.mek-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); margin: 0; }
.mek-fact { background: var(--bone); border-radius: var(--radius-md); padding: var(--space-3); min-width: 0; }
.mek-fact dt { font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-1); }
.mek-fact dd { margin: 0; font: 500 22px/28px var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }
.mek-fact dd small { display: block; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.mek-fact--wide { grid-column: 1 / -1; }

/* ---------- Anatomy hotspot ---------- */
.mek-hotspot {
  position: relative; display: grid; place-items: center;
  width: 28px; height: 28px; padding: 0; border-radius: var(--radius-pill);
  background: var(--amber); color: var(--on-amber); border: 2px solid var(--surface);
  font: 600 13px/1 var(--font-mono); cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
}
.mek-hotspot::after { /* 48px hit area */
  content: ""; position: absolute; inset: -10px; border-radius: var(--radius-pill);
}
.mek-hotspot.is-active { background: var(--rust); color: var(--on-rust); transform: scale(1.15); }
.mek-hotspot:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.mek-hotspot__label {
  position: absolute; left: 34px; top: 50%; transform: translateY(-50%);
  white-space: nowrap; padding: 4px var(--space-2); border-radius: var(--radius-sm);
  background: var(--ink); color: var(--paper); font: 600 12px/16px var(--font-sans);
  pointer-events: none;
}

/* ---------- Anatomy panel (bottom sheet) ---------- */
.mek-sheet {
  background: var(--surface); color: var(--ink);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-sheet);
  padding: var(--space-3) var(--space-4) var(--space-6);
}
.mek-sheet__grip { width: 40px; height: 4px; border-radius: var(--radius-pill); background: var(--line); margin: 0 auto var(--space-3); }
.mek-sheet__head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
.mek-sheet__num { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--rust); color: var(--on-rust); font: 600 14px/1 var(--font-mono); }
.mek-sheet__title { margin: 0; font: 600 20px/26px var(--font-sans); }
.mek-sheet__sub { margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); font-style: italic; }
.mek-sheet__body { margin: var(--space-3) 0 0; font: 400 16px/24px var(--font-sans); max-width: 68ch; }
.mek-sheet__fn { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--line); }
.mek-sheet__fn dt { font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--rust); margin-bottom: var(--space-1); }
.mek-sheet__fn dd { margin: 0; font: 400 16px/24px var(--font-sans); }
.mek-sheet__nav { display: flex; justify-content: space-between; margin-top: var(--space-4); }

/* ---------- Printed exhibit card (QR) ---------- */
.mek-card {
  display: grid; grid-template-columns: 1fr auto; gap: var(--space-4); align-items: end;
  width: 100%; max-width: 520px; padding: var(--space-6);
  background: var(--surface); color: var(--ink); border-radius: var(--radius-md);
  border-top: 8px solid var(--rust);
}
.mek-card__eyebrow { font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
.mek-card__title { font: 600 32px/36px var(--font-display); margin: 0; }
.mek-card__sci { font: italic 400 16px/22px var(--font-display); color: var(--ink-muted); margin: var(--space-1) 0 var(--space-4); }
.mek-card__cta { font: 600 14px/20px var(--font-sans); margin: 0; }
.mek-card__cta span { display: block; font-weight: 400; color: var(--ink-muted); }
.mek-card__qr { width: 128px; height: 128px; background: #ffffff; padding: 8px; border-radius: var(--radius-sm); }
.mek-card__qr svg, .mek-card__qr img { width: 100%; height: 100%; display: block; }
.mek-card__id { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 500 12px/16px var(--font-mono); color: var(--ink-muted); border-top: 1px solid var(--line); padding-top: var(--space-2); }

/* Page layout for Museum Explorer Karlsruhe. Components come from mek.css (design system). */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/24px var(--font-sans); }
a { color: var(--rust); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-2) var(--space-4); background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.wordmark { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); line-height: 1.1; }
.wordmark b { font: 600 18px/22px var(--font-display); }
.wordmark span { font: 600 11px/14px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--space-4); }
section { margin-top: var(--space-8); }
h2 { font: 600 24px/30px var(--font-display); margin: 0 0 var(--space-3); }
.eyebrow { font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
.muted { color: var(--ink-muted); }
.small { font-size: 14px; line-height: 20px; }

/* ---------- exhibit head ---------- */
.ex-head { margin-top: var(--space-6); }
.ex-head .tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
.ex-head h1 { font: 600 clamp(36px, 9vw, 56px)/1.05 var(--font-display); letter-spacing: -0.5px; margin: 0; overflow-wrap: anywhere; }
.ex-head .sci { font: italic 400 18px/26px var(--font-display); color: var(--ink-muted); margin: var(--space-1) 0 0; }

/* ---------- layout: stage + side ---------- */
.ex-grid { display: grid; gap: var(--space-6); margin-top: var(--space-4); }
@media (min-width: 960px) {
  .ex-grid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
  .ex-side { position: sticky; top: 72px; }
}

/* ---------- 3D stage ---------- */
.stage { position: relative; margin: 0; border-radius: var(--radius-lg); overflow: hidden; background: radial-gradient(120% 90% at 50% 20%, var(--surface) 0%, var(--bone) 100%); }
.stage model-viewer { display: block; width: 100%; height: min(68vh, 560px); min-height: 380px; --poster-color: transparent; background: transparent; }
.stage-top { position: absolute; top: var(--space-3); left: var(--space-3); right: var(--space-3); display: flex; justify-content: space-between; gap: var(--space-2); pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.chips { display: inline-flex; padding: var(--space-1); gap: 2px; background: color-mix(in srgb, var(--surface) 88%, transparent); border-radius: var(--radius-pill); }
.chips button { min-height: 36px; padding: 0 var(--space-3); border: 0; background: transparent; color: var(--ink-muted); font: 600 13px/1 var(--font-sans); border-radius: var(--radius-pill); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stage-bar { position: absolute; left: var(--space-3); right: var(--space-3); bottom: var(--space-3); display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.stage-bar .grow { flex: 1; }
.icon-btn { width: var(--space-12); height: var(--space-12); display: grid; place-items: center; border-radius: var(--radius-md); border: 0;
  background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink); cursor: pointer; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { background: var(--amber); color: var(--on-amber); }
.toggle-btn { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--space-12); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 0;
  background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink); font: 600 15px/1 var(--font-sans); cursor: pointer; }
.toggle-btn svg { width: 20px; height: 20px; }
.toggle-btn[aria-pressed="true"] { background: var(--amber); color: var(--on-amber); }
.stage-note { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: space-between; margin-top: var(--space-2); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.ar-note { font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: var(--space-2) 0 0; }

/* hotspots only in anatomy mode */
model-viewer .mek-hotspot { display: none; }
model-viewer.anatomy .mek-hotspot { display: grid; }
model-viewer .mek-hotspot:not([data-visible]) { opacity: .35; }
model-viewer .mek-hotspot.is-active { opacity: 1; }
model-viewer .mek-hotspot__label { display: none; }
model-viewer.anatomy .mek-hotspot.is-active .mek-hotspot__label { display: block; }
@media (hover: hover) { model-viewer.anatomy .mek-hotspot:hover .mek-hotspot__label { display: block; } }
.stage { scroll-margin-top: 64px; }

/* ---------- story / parts / sources ---------- */
.story p { margin: 0 0 var(--space-3); max-width: 68ch; }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.parts button { width: 100%; display: flex; align-items: center; gap: var(--space-3); text-align: left; min-height: var(--space-12); padding: var(--space-2) var(--space-3);
  border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: 600 16px/22px var(--font-sans); cursor: pointer; }
.parts button .num { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--amber); color: var(--on-amber); font: 600 13px/1 var(--font-mono); }
.parts button small { display: block; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.parts button[aria-current="true"] { border-color: var(--rust); }
.parts button[aria-current="true"] .num { background: var(--rust); color: var(--on-rust); }
.sources { font-size: 14px; line-height: 20px; color: var(--ink-muted); padding-left: 18px; }
.sources li { margin-bottom: var(--space-1); }

/* ---------- anatomy sheet ---------- */
.sheet-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; pointer-events: none; transform: translateY(105%); transition: transform .2s ease; }
.sheet-wrap.open { transform: none; }
.sheet-wrap .mek-sheet { pointer-events: auto; width: 100%; max-width: 560px; max-height: 44vh; overflow: auto; position: relative; }
.sheet-close { position: absolute; top: var(--space-2); right: var(--space-2); }
@media (min-width: 960px) {
  .sheet-wrap { left: auto; right: var(--space-6); bottom: var(--space-6); width: 420px; transform: translateX(120%); }
  .sheet-wrap .mek-sheet { border-radius: var(--radius-lg); }
}

/* ---------- home ---------- */
.hero { padding: var(--space-8) 0 var(--space-4); }
.hero h1 { font: 600 clamp(40px, 10vw, 72px)/1 var(--font-display); letter-spacing: -1px; margin: 0 0 var(--space-3); }
.hero p { max-width: 60ch; margin: 0; font-size: 18px; line-height: 28px; color: var(--ink-muted); }
.ex-list { display: grid; gap: var(--space-4); }
@media (min-width: 760px) { .ex-list { grid-template-columns: 1.3fr 1fr; } .ex-list .ex-card:first-child { grid-row: span 2; } }
.ex-card { display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-6); padding: var(--space-6); border-radius: var(--radius-md);
  background: var(--surface); color: var(--ink); text-decoration: none; border-top: 8px solid var(--rust); min-height: 200px; }
.ex-card:hover h3 { text-decoration: underline; text-underline-offset: 4px; }
.ex-card h3 { font: 600 30px/34px var(--font-display); margin: 0; }
.ex-card .sci { font: italic 400 16px/22px var(--font-display); color: var(--ink-muted); margin: var(--space-1) 0 0; }
.ex-card .foot { display: flex; justify-content: space-between; align-items: end; gap: var(--space-2); flex-wrap: wrap; }
.ex-card.hero-card { background: var(--basalt); color: var(--on-basalt); }
.ex-card.hero-card .sci, .ex-card.hero-card .eyebrow { color: color-mix(in srgb, var(--on-basalt) 80%, transparent); }
.ex-card.hero-card .mek-tag--id { background: color-mix(in srgb, var(--on-basalt) 15%, transparent); color: var(--on-basalt); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--space-3); counter-reset: s; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.steps li { counter-increment: s; background: var(--bone); border-radius: var(--radius-md); padding: var(--space-4); }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--amber); color: var(--on-amber); font: 600 14px/1 var(--font-mono); margin-bottom: var(--space-3); }
.steps b { display: block; font: 600 18px/24px var(--font-sans); margin-bottom: var(--space-1); }
.overview-map { height: 360px; border-radius: var(--radius-md); overflow: hidden; }
footer { margin: var(--space-16) 0 0; padding: var(--space-6) 0 var(--space-8); border-top: 1px solid var(--line); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
footer .wrap { display: grid; gap: var(--space-2); }
.map-card .map.floor { background: color-mix(in srgb, var(--on-basalt) 8%, transparent); }
model-viewer::part(default-progress-bar) { background-color: var(--rust); height: 3px; }


:root { --map-water: #dfe6e4; --map-land: #e7dcc6; --map-coast: #8a8172; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --map-water: #1f2a2a; --map-land: #3a352c; --map-coast: #8a8172; color-scheme: dark; } }
:root[data-theme="dark"] { --map-water: #1f2a2a; --map-land: #3a352c; --map-coast: #8a8172; color-scheme: dark; }
html, body { overflow-x: hidden; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.stage-tag { background: color-mix(in srgb, var(--surface) 88%, transparent); }
.maps { display: grid; gap: var(--space-4); }
@media (min-width: 760px) { .maps { grid-template-columns: 1fr 1fr; } }
.map-card { background: var(--basalt); color: var(--on-basalt); border-radius: var(--radius-md); padding: var(--space-2); min-width: 0; }
.map-card h3 { font: 600 16px/22px var(--font-sans); margin: var(--space-1) var(--space-2) var(--space-2); display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.map-card .map { border-radius: var(--radius-sm); overflow: hidden; background: var(--map-water); }
.map-card .map svg { width: 100%; height: auto; display: block; }
.map-card .map.floor, .map-card .map.empty { background: color-mix(in srgb, var(--on-basalt) 8%, transparent); }
.stage-top { flex-wrap: wrap; }
.real-object { margin: var(--space-3) 0 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--bone); font-size: 14px; line-height: 20px; color: var(--ink); }
.map-card .cap { margin: var(--space-2) var(--space-2) var(--space-1); font-size: 13px; line-height: 18px; color: color-mix(in srgb, var(--on-basalt) 85%, transparent); }
.map-card .cap a { color: var(--amber); }
.map-card .mek-tag--illustrative { color: var(--on-basalt); }

<script type="application/json" id="mek-data">{"museum": {"name": {"en": "State Museum of Natural History Karlsruhe", "de": "Staatliches Museum für Naturkunde Karlsruhe"}, "short": "SMNK", "address": "Erbprinzenstraße 13, 76133 Karlsruhe", "lat": 49.0073, "lon": 8.4003, "coordSource": "Wikipedia: State Museum of Natural History Karlsruhe (building-level point)"}, "exhibits": [{"id": "EX01", "hero": true, "model": "models/quetzalcoatlus.wasm", "animations": ["Flap", "Glide"], "orbit": "40deg 68deg auto", "name": {"en": "Quetzalcoatlus", "de": "Quetzalcoatlus"}, "sci": "Quetzalcoatlus northropi", "eyebrow": {"en": "Giant pterosaur", "de": "Riesenflugsaurier"}, "era": {"en": "Late Cretaceous · ~68 Ma", "de": "Oberkreide · ~68 Mio. J."}, "facts": [{"label": {"en": "Age", "de": "Alter"}, "value": "~68 Ma", "note": {"en": "Maastrichtian, Late Cretaceous", "de": "Maastrichtium, Oberkreide"}}, {"label": {"en": "Wingspan", "de": "Spannweite"}, "value": "10–11 m", "note": {"en": "estimate", "de": "Schätzung"}}, {"label": {"en": "Found", "de": "Gefunden"}, "value": "1971", "note": {"en": "Big Bend NP, Texas, USA", "de": "Big-Bend-NP, Texas, USA"}}, {"label": {"en": "In the museum", "de": "Im Museum"}, "value": {"en": "Entrance", "de": "Eingang"}, "note": {"en": "life-size model outdoors", "de": "lebensgroßes Modell im Freien"}}], "story": {"en": ["Quetzalcoatlus northropi is one of the largest animals ever known to have flown. It was not a dinosaur but a pterosaur: a flying reptile from a neighbouring branch of the reptile family tree.", "Its first bones, parts of one giant wing, were found in 1971 by geology student Douglas Lawson in the Javelina Formation of Big Bend National Park, Texas. He named the species in 1975 after the Aztec feathered-serpent god Quetzalcoatl and the aircraft designer Jack Northrop.", "The life-size model in front of the Karlsruhe museum is a reconstruction, and it inspired the museum's new mascot in 2026. Only fragments of Q. northropi are known, so details such as the head crest follow its smaller relative Q. lawsoni."], "de": ["Quetzalcoatlus northropi gehört zu den größten Tieren, die je geflogen sind. Er war kein Dinosaurier, sondern ein Flugsaurier: ein fliegendes Reptil aus einem benachbarten Zweig des Reptilien-Stammbaums.", "Seine ersten Knochen, Teile eines riesigen Flügels, fand der Geologiestudent Douglas Lawson 1971 in der Javelina-Formation im Big-Bend-Nationalpark in Texas. 1975 benannte er die Art nach dem aztekischen Federschlangengott Quetzalcoatl und dem Flugzeugkonstrukteur Jack Northrop.", "Das lebensgroße Modell vor dem Karlsruher Museum ist eine Rekonstruktion; 2026 wurde es zum Vorbild für das neue Museumsmaskottchen. Von Q. northropi kennt man nur Bruchstücke, deshalb folgen Details wie der Kopfkamm seinem kleineren Verwandten Q. lawsoni."]}, "inMuseum": {"kind": "outdoor", "lat": 49.0073, "lon": 8.4003, "precision": {"en": "Building-level point; the model stands in front of the main entrance.", "de": "Punkt auf Gebäudeebene; das Modell steht vor dem Haupteingang."}, "verified": true}, "found": {"lat": 29.25, "lon": -103.25, "place": {"en": "Big Bend National Park, Texas, USA", "de": "Big-Bend-Nationalpark, Texas, USA"}, "precision": {"en": "Park-level location. The exact fossil site is not shown.", "de": "Lage auf Parkebene. Die genaue Fundstelle wird nicht gezeigt."}, "distanceKm": 8999}, "parts": [{"id": "crest", "name": {"en": "Head crest", "de": "Kopfkamm"}, "term": {"en": "cranial crest", "de": "Schädelkamm"}, "desc": {"en": "A thin bony crest rose from the skull. It is known from the smaller Q. lawsoni; for Q. northropi its exact shape is unknown, so this crest is a reconstruction.", "de": "Ein dünner Knochenkamm ragte vom Schädel auf. Bekannt ist er vom kleineren Q. lawsoni; seine genaue Form bei Q. northropi kennt man nicht – dieser Kamm ist rekonstruiert."}, "fn": {"en": "Most likely display: signalling species, age or maturity to other pterosaurs.", "de": "Vermutlich zur Schau: Er zeigte anderen Flugsauriern Art, Alter oder Reife an."}, "n": 1, "position": [0.04, 0.98, 3.65], "normal": [1, 0, 0]}, {"id": "beak", "name": {"en": "Toothless beak", "de": "Zahnloser Schnabel"}, "term": {"en": "rostrum", "de": "Rostrum"}, "desc": {"en": "The jaws were long, pointed and had no teeth. Together with the skull they made up a large part of the animal's length.", "de": "Die Kiefer waren lang, spitz und zahnlos. Zusammen mit dem Schädel machten sie einen großen Teil der Körperlänge aus."}, "fn": {"en": "Catching food. Many researchers think it stalked on the ground like a giant stork, snapping up small animals; other feeding ideas are still debated.", "de": "Nahrungsaufnahme. Viele Forschende vermuten, dass er wie ein riesiger Storch am Boden jagte und kleine Tiere schnappte; andere Ideen werden noch diskutiert."}, "n": 2, "position": [0.07, 0.3, 4.75], "normal": [1, 0, 0]}, {"id": "neck", "name": {"en": "Long neck", "de": "Langer Hals"}, "term": {"en": "cervical vertebrae", "de": "Halswirbel"}, "desc": {"en": "The neck was very long but built from only a few, greatly lengthened vertebrae, which made it fairly stiff.", "de": "Der Hals war sehr lang, bestand aber aus nur wenigen, stark verlängerten Wirbeln und war daher recht steif."}, "fn": {"en": "Reaching down to the ground for food while standing on all fours.", "de": "Bis zum Boden reichen, um auf allen vieren stehend Nahrung aufzunehmen."}, "n": 3, "position": [0.14, 0.5, 2.1], "normal": [1, 0, 0]}, {"id": "pteroid", "name": {"en": "Pteroid bone", "de": "Pteroid"}, "term": {"en": "os pteroideum", "de": "Os pteroideum"}, "desc": {"en": "A rod-shaped bone found only in pterosaurs. It sat at the wrist and pointed towards the shoulder.", "de": "Ein stabförmiger Knochen, den es nur bei Flugsauriern gibt. Er saß am Handgelenk und zeigte zur Schulter."}, "fn": {"en": "It supported the small front membrane (propatagium). Angling it changed the wing's leading edge, helping to control lift at low speed.", "de": "Er stützte die kleine vordere Flughaut (Propatagium). Durch sein Anwinkeln änderte sich die Flügelvorderkante – das half, den Auftrieb bei geringer Geschwindigkeit zu steuern."}, "n": 4, "position": [1.5, 0.15, 0.62], "normal": [0, 1, 0]}, {"id": "wingfinger", "name": {"en": "Wing finger", "de": "Flugfinger"}, "term": {"en": "4th finger (digit IV)", "de": "4. Finger (Digitus IV)"}, "desc": {"en": "The entire outer wing hung from one enormously lengthened fourth finger. The three small fingers in front of it kept their claws.", "de": "Der gesamte äußere Flügel hing an einem enorm verlängerten vierten Finger. Die drei kleinen Finger davor trugen weiterhin Krallen."}, "fn": {"en": "Holding the outer membrane taut in flight; it folded away when the animal walked.", "de": "Spannte im Flug die äußere Flughaut; beim Gehen wurde er eingeklappt."}, "n": 5, "position": [3.9, 0.1, 0.1], "normal": [0, 1, 0]}, {"id": "membrane", "name": {"en": "Wing membrane", "de": "Flughaut"}, "term": {"en": "brachiopatagium", "de": "Brachiopatagium"}, "desc": {"en": "The main wing was living skin stretched between the wing finger, the body and the hind leg, stiffened by fine fibres called actinofibrils.", "de": "Der Hauptflügel war lebende Haut zwischen Flugfinger, Körper und Hinterbein, versteift durch feine Fasern, die Aktinofibrillen."}, "fn": {"en": "The lifting surface for flight.", "de": "Die tragende Fläche für den Flug."}, "n": 6, "position": [2.6, -0.05, -0.9], "normal": [0, 1, 0]}, {"id": "hindlimb", "name": {"en": "Hind limb", "de": "Hinterbein"}, "term": {"en": "femur, tibia, foot", "de": "Oberschenkel, Schienbein, Fuß"}, "desc": {"en": "Pterosaurs walked on four limbs with the wing finger folded up; fossil trackways show this four-legged gait.", "de": "Flugsaurier liefen auf vier Beinen mit eingeklapptem Flugfinger; fossile Fährten belegen diesen vierbeinigen Gang."}, "fn": {"en": "Walking, and the first push at take-off. Most researchers think giant pterosaurs launched on all fours, vaulting into the air mainly with their strong arms.", "de": "Gehen und der erste Schub beim Start. Die meisten Forschenden nehmen an, dass Riesenflugsaurier vierbeinig starteten und sich vor allem mit den kräftigen Armen in die Luft katapultierten."}, "n": 7, "position": [0.4, -0.3, -1.25], "normal": [1, 0, 0]}], "sources": [{"title": "Quetzalcoatlus — Wikipedia", "url": "https://en.wikipedia.org/wiki/Quetzalcoatlus"}, {"title": "SMNK press release: museum mascot (13 Mar 2026)", "url": "https://www.smnk.de/fileadmin/page_content/pressemitteilungen/PM_Maskottchen_Name_gesucht.pdf"}, {"title": "Pteros: Quetzalcoatlus", "url": "https://www.pteros.com/pterosaurs/quetzalcoatlus"}], "anatomyOrbit": "30deg 45deg auto", "partRadius": "7.5m", "realObject": {"en": "In the museum: the life-size standing model (about 13 m wingspan) in front of the main entrance. The app shows the same animal in flight.", "de": "Im Museum: das lebensgroße, stehende Modell (ca. 13 m Spannweite) vor dem Haupteingang. Die App zeigt dasselbe Tier im Flug."}}, {"id": "EX02", "model": "models/hippotherium_skeleton.wasm", "animations": [], "orbit": "35deg 75deg 3.4m", "name": {"en": "Three-toed horse", "de": "Dreizehiges Urpferd"}, "sci": "Hippotherium primigenium", "eyebrow": {"en": "Höwenegg fossil · mounted skeleton", "de": "Höwenegg-Fossil · montiertes Skelett"}, "era": {"en": "Late Miocene · 10.3 Ma", "de": "Obermiozän · 10,3 Mio. J."}, "facts": [{"label": {"en": "Age", "de": "Alter"}, "value": "10.3 Ma", "note": {"en": "argon dating of the lake layers", "de": "Argon-Datierung der Seeschichten"}}, {"label": {"en": "Toes", "de": "Zehen"}, "value": "3", "note": {"en": "per foot; shoulder height about 1.3 m", "de": "pro Fuß; Schulterhöhe etwa 1,3 m"}}, {"label": {"en": "Found", "de": "Gefunden"}, "value": "1950–2013", "note": {"en": "Höwenegg excavations, Hegau", "de": "Grabungen am Höwenegg, Hegau"}}, {"label": {"en": "In the museum", "de": "Im Museum"}, "value": {"en": "Geology", "de": "Erdgeschichte"}, "note": {"en": "gallery position illustrative", "de": "Position veranschaulichend"}}], "story": {"en": ["About ten million years ago a lake lay beside the Höwenegg volcano in the Hegau. Animals that died at its shore sank into fine lake mud, which preserved whole skeletons: three-toed horses, antelopes, rhinoceroses and more.", "The site was excavated from 1950 to 1963 and again from 2003, with the natural history museums of Karlsruhe and Stuttgart. Dating of a volcanic crystal gives the fossil layers an age of 10.3 million years.", "Hippotherium belonged to the hipparionine horses, a branch that later died out. It still had three toes on each foot, while today’s horses stand on one. The Karlsruhe museum shows complete mounted skeletons from the Höwenegg; this is a simplified model of such a mount."], "de": ["Vor etwa zehn Millionen Jahren lag am Höwenegg-Vulkan im Hegau ein See. Tiere, die an seinem Ufer starben, sanken in feinen Seeschlamm, der ganze Skelette bewahrte: dreizehige Pferde, Antilopen, Nashörner und mehr.", "Ausgegraben wurde von 1950 bis 1963 und erneut ab 2003, gemeinsam mit den Naturkundemuseen Karlsruhe und Stuttgart. Die Datierung eines vulkanischen Kristalls ergibt für die Fundschichten ein Alter von 10,3 Millionen Jahren.", "Hippotherium gehörte zu den Hipparion-Pferden, einem später ausgestorbenen Zweig. Es hatte noch drei Zehen an jedem Fuß, während heutige Pferde auf einer stehen. Das Karlsruher Museum zeigt vollständige montierte Skelette vom Höwenegg; dies ist ein vereinfachtes Modell einer solchen Montage."]}, "inMuseum": {"kind": "indoor", "zone": "geology", "lat": 49.0073, "lon": 8.4003, "precision": {"en": "Indoor position is illustrative until checked against an official floor plan.", "de": "Die Position im Gebäude ist veranschaulichend, bis sie mit einem offiziellen Grundriss geprüft ist."}, "verified": false}, "found": {"lat": 47.9144, "lon": 8.7416, "place": {"en": "Höwenegg, Immendingen (Hegau), Germany", "de": "Höwenegg, Immendingen (Hegau)"}, "precision": {"en": "Summit point of the Höwenegg; the quarry lies on its slopes.", "de": "Gipfelpunkt des Höweneggs; der Steinbruch liegt an seinen Hängen."}, "distanceKm": 124}, "parts": [{"id": "skull", "name": {"en": "Skull", "de": "Schädel"}, "term": {"en": "cranium", "de": "Cranium"}, "desc": {"en": "A long, low horse skull with large eye sockets set far back, so the animal could watch for predators while grazing.", "de": "Ein langer, flacher Pferdeschädel mit großen, weit hinten liegenden Augenhöhlen – so konnte das Tier beim Fressen nach Feinden Ausschau halten."}, "fn": {"en": "Houses the brain and the senses; its length makes room for the long rows of cheek teeth.", "de": "Beherbergt Gehirn und Sinnesorgane; die Länge schafft Platz für die langen Backenzahnreihen."}, "n": 1, "position": [0.1, 1.55, 1.1], "normal": [1, 0, 0]}, {"id": "teeth", "name": {"en": "High-crowned teeth", "de": "Hochkronige Zähne"}, "term": {"en": "hypsodont cheek teeth", "de": "hypsodonte Backenzähne"}, "desc": {"en": "Tall cheek teeth with folded enamel. Worn surfaces from Höwenegg show a mixed diet of leaves and grasses.", "de": "Hohe Backenzähne mit gefaltetem Schmelz. Abnutzungsspuren von Höwenegg-Zähnen zeigen eine gemischte Nahrung aus Blättern und Gräsern."}, "fn": {"en": "Grinding tough plant food for many years without wearing out.", "de": "Zähes Pflanzenmaterial über viele Jahre zermahlen, ohne sich abzunutzen."}, "n": 2, "position": [0.06, 1.32, 1.3], "normal": [1, 0, 0]}, {"id": "threetoes", "name": {"en": "Three-toed foot", "de": "Dreizehiger Fuß"}, "term": {"en": "digits II, III and IV", "de": "Zehen II, III und IV"}, "desc": {"en": "The middle toe carried a large hoof; two smaller side toes sat higher up. Today’s horses stand on the middle toe alone.", "de": "Die Mittelzehe trug einen großen Huf; zwei kleinere Seitenzehen saßen höher. Heutige Pferde stehen nur noch auf der Mittelzehe."}, "fn": {"en": "Support and grip; the side toes probably touched the ground only on soft footing or at speed – still being studied.", "de": "Stütze und Halt; die Seitenzehen berührten den Boden wohl nur auf weichem Grund oder bei schnellem Lauf – wird noch erforscht."}, "n": 3, "position": [0.19, 0.08, 0.36], "normal": [1, 0, 0]}, {"id": "cannon", "name": {"en": "Cannon bone", "de": "Röhrbein"}, "term": {"en": "metacarpal III", "de": "Mittelhandknochen III"}, "desc": {"en": "One long, strong bone between the wrist and the toes – the same bone a modern horse stands on.", "de": "Ein langer, kräftiger Knochen zwischen Handwurzel und Zehen – derselbe Knochen, auf dem ein heutiges Pferd steht."}, "fn": {"en": "A light lever that lengthens the stride for fast running.", "de": "Ein leichter Hebel, der die Schrittlänge für schnelles Laufen vergrößert."}, "n": 4, "position": [0.17, 0.3, 0.3], "normal": [1, 0, 0]}, {"id": "spine", "name": {"en": "Spine and withers", "de": "Wirbelsäule und Widerrist"}, "term": {"en": "vertebral column", "de": "Wirbelsäule"}, "desc": {"en": "Tall spines on the vertebrae above the shoulders anchor the neck ligament that holds up the heavy head.", "de": "Hohe Dornfortsätze über den Schultern verankern das Nackenband, das den schweren Kopf hält."}, "fn": {"en": "Carries the body between the limbs and lets the horse lower its head to graze without effort.", "de": "Trägt den Körper zwischen den Gliedmaßen und lässt das Pferd den Kopf mühelos zum Grasen senken."}, "n": 5, "position": [0.05, 1.42, 0.0], "normal": [0, 1, 0]}, {"id": "hindlimb", "name": {"en": "Hind limb", "de": "Hinterbein"}, "term": {"en": "femur, tibia, metatarsal", "de": "Oberschenkel, Schienbein, Mittelfuß"}, "desc": {"en": "Long hind legs with the knee high up near the body; the visible “knee” of a horse is really its ankle.", "de": "Lange Hinterbeine mit dem Knie hoch am Körper; das sichtbare „Knie“ eines Pferdes ist in Wahrheit sein Sprunggelenk."}, "fn": {"en": "The main engine for running: the hind legs push the body forward.", "de": "Der Motor beim Laufen: Die Hinterbeine schieben den Körper vorwärts."}, "n": 6, "position": [0.17, 0.62, -0.68], "normal": [1, 0, 0]}], "sources": [{"title": "Höwenegg research, Ber. Inst. Erdwiss. Graz 10 (2005)", "url": "https://opac.geologie.ac.at/ais312/dokumente/Ber_Inst_Erdwiss_Univ_Graz_10_005_006.pdf"}, {"title": "Höwenegg Hippotherium primigenium (Bernor et al.)", "url": "https://par.nsf.gov/servlets/purl/10513223"}, {"title": "Geopark Schwäbische Alb: Vulkanlandschaft Höwenegg", "url": "https://www.geopark-alb.de/en/experience-geopark/journey-into-earths-history/detail/vulkanlandschaft-hoewenegg"}, {"title": "Hippotherium — Wikipedia", "url": "https://en.wikipedia.org/wiki/Hippotherium"}], "anatomyOrbit": "35deg 70deg 3.4m", "partRadius": "1.6m", "realObject": {"en": "In the museum: complete Höwenegg skeletons in the geology galleries. The app shows a simplified mounted skeleton of the same species.", "de": "Im Museum: vollständige Höwenegg-Skelette in der Erdgeschichte. Die App zeigt ein vereinfachtes montiertes Skelett derselben Art."}}, {"id": "EX03", "model": "models/nordkaper_skeleton.wasm", "animations": [], "orbit": "60deg 75deg 20m", "name": {"en": "North Atlantic right whale", "de": "Nordkaper"}, "sci": "Eubalaena glacialis", "eyebrow": {"en": "Skeleton · largest object in the museum", "de": "Skelett · größtes Schauobjekt"}, "era": {"en": "Living species · critically endangered", "de": "Lebende Art · vom Aussterben bedroht"}, "facts": [{"label": {"en": "Length", "de": "Länge"}, "value": "~13 m", "note": {"en": "the Karlsruhe skeleton", "de": "das Karlsruher Skelett"}}, {"label": {"en": "Population", "de": "Bestand"}, "value": "~384", "note": {"en": "estimate for 2024", "de": "Schätzung für 2024"}}, {"label": {"en": "Feeding", "de": "Ernährung"}, "value": {"en": "Baleen", "de": "Barten"}, "note": {"en": "filters tiny crustaceans", "de": "filtert Kleinkrebse"}}, {"label": {"en": "In the museum", "de": "Im Museum"}, "value": {"en": "Whale hall", "de": "Walsaal"}, "note": {"en": "gallery position illustrative", "de": "Position veranschaulichend"}}], "story": {"en": ["The skeleton of a Nordkaper almost 13 metres long is the largest object on show in the Karlsruhe museum.", "Right whales have no teeth. Hundreds of baleen plates hang from the arched upper jaw and sieve tiny crustaceans out of the water as the whale swims with its mouth open.", "Hunted almost to extinction, the species is still critically endangered: scientists estimated about 384 animals in 2024. Ship strikes and entanglement in fishing gear are the main threats."], "de": ["Das Skelett eines fast 13 Meter langen Nordkapers ist das größte Schauobjekt des Karlsruher Museums.", "Glattwale haben keine Zähne. Hunderte Barten hängen vom gewölbten Oberkiefer und sieben winzige Krebstiere aus dem Wasser, während der Wal mit offenem Maul schwimmt.", "Fast ausgerottet, ist die Art bis heute vom Aussterben bedroht: 2024 schätzte man etwa 384 Tiere. Schiffskollisionen und Verstrickung in Fischereigerät sind die größten Gefahren."]}, "inMuseum": {"kind": "indoor", "zone": "whales", "lat": 49.0073, "lon": 8.4003, "precision": {"en": "Indoor position is illustrative until checked against an official floor plan.", "de": "Die Position im Gebäude ist veranschaulichend, bis sie mit einem offiziellen Grundriss geprüft ist."}, "verified": false}, "found": null, "foundNote": {"en": "Where this specimen was found is not verified, so it is not mapped.", "de": "Der Fundort dieses Exemplars ist nicht belegt und wird daher nicht kartiert."}, "parts": [{"id": "rostrum", "name": {"en": "Arched upper jaw", "de": "Gewölbter Oberkiefer"}, "term": {"en": "rostrum", "de": "Rostrum"}, "desc": {"en": "The upper jaw is narrow and strongly arched, a hallmark of right whales.", "de": "Der Oberkiefer ist schmal und stark gewölbt – ein Kennzeichen der Glattwale."}, "fn": {"en": "Makes room for the baleen plates, which in right whales can be over two metres long.", "de": "Schafft Platz für die Barten, die bei Glattwalen über zwei Meter lang werden können."}, "n": 1, "position": [0.25, 2.95, 4.8], "normal": [0, 1, 0]}, {"id": "mandible", "name": {"en": "Lower jaw", "de": "Unterkiefer"}, "term": {"en": "mandibles", "de": "Mandibeln"}, "desc": {"en": "Two huge, bowed jawbones that are not fused at the front.", "de": "Zwei riesige, gebogene Kieferknochen, die vorne nicht verwachsen sind."}, "fn": {"en": "With the lips they scoop around the baleen while the whale skims the water with its mouth open.", "de": "Mit den Lippen umschließen sie die Barten wie eine Schaufel, während der Wal mit offenem Maul das Wasser durchsiebt."}, "n": 2, "position": [1.32, 1.68, 4.2], "normal": [1, 0, 0]}, {"id": "flipper", "name": {"en": "Flipper", "de": "Brustflosse"}, "term": {"en": "humerus, radius, ulna, phalanges", "de": "Oberarm, Speiche, Elle, Fingerglieder"}, "desc": {"en": "Inside the paddle are the same bones as in a human arm: upper arm, forearm and finger bones.", "de": "In der Flosse stecken dieselben Knochen wie im menschlichen Arm: Oberarm, Unterarm und Fingerknochen."}, "fn": {"en": "Steering and balance; the tail does the pushing.", "de": "Steuern und Gleichgewicht; den Vortrieb liefert der Schwanz."}, "n": 3, "position": [1.2, 0.45, 1.72], "normal": [1, 0, 0]}, {"id": "ribs", "name": {"en": "Ribs", "de": "Rippen"}, "term": {"en": "costae", "de": "Costae"}, "desc": {"en": "Long, curved ribs, only loosely connected to the spine.", "de": "Lange, gebogene Rippen, nur lose mit der Wirbelsäule verbunden."}, "fn": {"en": "Protect heart and lungs while letting the chest compress during dives.", "de": "Schützen Herz und Lunge und lassen den Brustkorb beim Tauchen nachgeben."}, "n": 4, "position": [1.32, 1.3, 0.9], "normal": [1, 0, 0]}, {"id": "pelvis", "name": {"en": "Pelvic remnant", "de": "Beckenrest"}, "term": {"en": "vestigial pelvic bones", "de": "rudimentäre Beckenknochen"}, "desc": {"en": "Two small bones floating free in the body are all that remains of the hips of the whale's four-legged land ancestors.", "de": "Zwei kleine, frei im Körper liegende Knochen sind alles, was von den Hüften der vierbeinigen Vorfahren an Land übrig ist."}, "fn": {"en": "No longer used for walking; they anchor muscles of the reproductive organs.", "de": "Dienen nicht mehr zum Laufen; an ihnen setzen Muskeln der Geschlechtsorgane an."}, "n": 5, "position": [0.45, 1.1, -1.62], "normal": [1, 0, 0]}, {"id": "tail", "name": {"en": "Tail vertebrae", "de": "Schwanzwirbel"}, "term": {"en": "caudal vertebrae", "de": "Schwanzwirbel"}, "desc": {"en": "The spine continues deep into the tail, but the wide flukes contain no bone at all.", "de": "Die Wirbelsäule reicht weit in den Schwanz, doch die breite Fluke enthält keinen Knochen."}, "fn": {"en": "Muscles along these vertebrae drive the up-and-down stroke that powers swimming.", "de": "Muskeln an diesen Wirbeln erzeugen den Auf-und-ab-Schlag, der den Wal antreibt."}, "n": 6, "position": [0.12, 1.75, -5.6], "normal": [1, 0, 0]}], "sources": [{"title": "Service-BW: Staatliches Museum für Naturkunde Karlsruhe", "url": "https://www.heidelberg.de/,Lde/-/Behoerdenwegweiser/staatliches-museum-fuer-naturkunde-karlsruhe/oe6014081"}, {"title": "New England Aquarium: 2025 right whale population estimate", "url": "https://www.neaq.org/right-whale-population-estimate-2025/"}], "anatomyOrbit": "45deg 50deg 21m", "partRadius": "7m", "realObject": {"en": "In the museum: the mounted skeleton, almost 13 m long, in the whale hall. The app shows a simplified skeleton model of the same species.", "de": "Im Museum: das montierte, fast 13 m lange Skelett im Walsaal. Die App zeigt ein vereinfachtes Skelettmodell derselben Art."}}]}</script>

  };
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
  let lang = store.get('mek-lang') || ((navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en');
  if (!UI[lang]) lang = 'en';
  const t = (k) => UI[lang][k];
  const L = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[lang] ?? v.en) : v;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
    ar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
    bone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };

  const route = () => { const h = (location.hash || '').replace('#', '').toUpperCase(); return DATA.exhibits.some((e) => e.id === h) ? h : null; };

  function header() {
    document.getElementById('top').innerHTML = `
      <a class="wordmark" href="#home"><b>Museum Explorer</b><span>${esc(t('tagline'))}</span></a>
      <div class="mek-lang" role="group" aria-label="Language / Sprache">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="${lang === 'en'}">EN</button>
        <button type="button" id="lang-de" data-lang="de" aria-pressed="${lang === 'de'}">DE</button>
      </div>`;
    document.querySelector('.mek-lang').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return;
      lang = b.dataset.lang; store.set('mek-lang', lang); render();
    });
  }

  function floorPlan(zone) {
    const Z = UI[lang].zones, font = css('--font-sans').replace(/"/g, "'");
    const box = (id, x, y, w, h) => {
      const on = id === zone;
      return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${on ? 'var(--amber)' : 'rgba(244,239,230,0.10)'}" stroke="rgba(244,239,230,0.35)"/>
        <text x="${x + w / 2}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="middle" font-family="${font}" font-size="13" font-weight="600" fill="${on ? 'var(--on-amber)' : '#f4efe6'}">${esc(Z[id])}</text></g>`;
    };
    const pin = zone === 'entrance';
    return `<svg viewBox="0 0 400 260" role="img" aria-label="${esc(t('layout'))}">
      <rect x="20" y="20" width="360" height="180" rx="10" fill="none" stroke="rgba(244,239,230,0.55)" stroke-width="2"/>
      ${box('vivarium', 36, 36, 150, 70)}${box('minerals', 214, 36, 150, 70)}${box('geology', 36, 118, 150, 66)}${box('whales', 214, 118, 150, 66)}
      <rect x="170" y="196" width="60" height="8" fill="#f4efe6"/>
      <circle cx="200" cy="232" r="${pin ? 11 : 7}" fill="${pin ? 'var(--amber)' : 'rgba(244,239,230,0.35)'}" stroke="#fff" stroke-width="2"/>
      <text x="222" y="236" font-family="${font}" font-size="12" font-weight="600" fill="#f4efe6">${esc(t('entrance'))}${pin ? ' · Quetzalcoatlus' : ''}</text></svg>`;
  }

  // ---------------------------------------------------------------- exhibit
  let ex, mv, active = -1, anatomyOn = false, playing = true, anim = null, currentId = null;
  const osmLink = (lat, lon, z) => `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=${z}/${lat}/${lon}`;

  function renderExhibit(id) {
    ex = DATA.exhibits.find((e) => e.id === id);
    if (currentId !== id) { active = -1; anatomyOn = false; playing = true; anim = ex.animations[0] || null; currentId = id; }
    document.title = `${L(ex.name)} · Museum Explorer Karlsruhe`;
    const main = document.getElementById('main'), hasAnim = ex.animations.length > 0, parts = ex.parts;
    const M = DATA.museum;
    main.innerHTML = `
    <div class="wrap">
      <header class="ex-head">
        <div class="tags"><span class="mek-tag mek-tag--era">${esc(L(ex.era))}</span><span class="mek-tag mek-tag--id">${ex.id}</span></div>
        <p class="eyebrow">${esc(L(ex.eyebrow))}</p>
        <h1>${esc(L(ex.name))}</h1>
        <p class="sci">${esc(ex.sci)}</p>
      </header>
      <div class="ex-grid">
        <div>
          <figure class="stage">
            <model-viewer id="mv" src="${ex.model}" alt="${esc(L(ex.name))} – 3D" camera-controls touch-action="pan-y"
              ${hasAnim ? `autoplay animation-name="${anim}"` : 'auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg"'}
              max-camera-orbit="auto auto 400%" min-camera-orbit="auto auto 5%" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
              camera-orbit="${ex.orbit}" shadow-intensity="0.9" shadow-softness="0.8" exposure="1.05" interaction-prompt="auto" interpolation-decay="120">
              ${parts.map((p, i) => `<button class="mek-hotspot" slot="hotspot-${p.id}" data-i="${i}" data-position="${p.position.join('m ')}m" data-normal="${p.normal.join('m ')}m" type="button" aria-label="${p.n}: ${esc(L(p.name))}">${p.n}<span class="mek-hotspot__label">${esc(L(p.name))}</span></button>`).join('')}
            </model-viewer>
            <div class="stage-top">
              ${hasAnim ? `<div class="chips" role="group" aria-label="Animation">${ex.animations.map((a) => `<button type="button" data-anim="${a}" aria-pressed="${a === anim}">${esc(UI[lang].anims[a] || a)}</button>`).join('')}</div>` : '<span></span>'}
              <span class="mek-tag mek-tag--illustrative stage-tag">${esc(t('illustrative'))}</span>
            </div>
            <div class="stage-bar">
              ${hasAnim ? `<button class="icon-btn" id="playBtn" type="button" aria-label="${esc(t('pause'))}">${ICON.pause}</button>` : ''}
              <button class="toggle-btn" id="anatomyBtn" type="button" aria-pressed="${anatomyOn}">${ICON.bone}${esc(t('anatomy'))}</button>
              <span class="grow"></span>
              <button class="mek-btn mek-btn--primary" id="arBtn" type="button">${ICON.ar}${esc(t('ar'))}</button>
            </div>
          </figure>
          <div class="stage-note"><span>${esc(t('hint'))}</span><span>${esc(t('modelNote'))}</span></div>
          <p class="real-object">${esc(L(ex.realObject))}</p>
          <p class="ar-note" id="arNote"></p>
          <section aria-labelledby="h-story" class="story"><h2 id="h-story">${esc(t('story'))}</h2>${L(ex.story).map((s) => `<p>${esc(s)}</p>`).join('')}</section>
          <section aria-labelledby="h-maps">
            <h2 id="h-maps">${esc(t('mapsH'))}</h2>
            <div class="maps">
              <div class="map-card">
                <h3>${esc(t('inMuseum'))}${ex.inMuseum.verified ? '' : `<span class="mek-tag mek-tag--illustrative">${esc(t('illustrative'))}</span>`}</h3>
                <div class="map floor">${floorPlan(ex.inMuseum.zone)}</div>
                <p class="cap">${esc(L(ex.inMuseum.precision))}${ex.inMuseum.kind === 'indoor' ? ' ' + esc(t('layout')) + '.' : ''} <a href="${osmLink(M.lat, M.lon, 17)}" target="_blank" rel="noopener">${esc(t('osm'))}</a></p>
              </div>
              <div class="map-card">
                <h3>${esc(t('found'))}</h3>
                ${ex.found ? `<div class="map">${ex.id === 'EX02' ? MAPS.europe : MAPS.atlantic}</div>` : `<div class="map empty"><div class="map-empty">${esc(L(ex.foundNote))}</div></div>`}
                ${ex.found ? `<p class="cap"><b>${esc(L(ex.found.place))}</b> · ${esc(t('distance')(ex.found.distanceKm))}. ${esc(L(ex.found.precision))} <a href="${osmLink(ex.found.lat, ex.found.lon, 11)}" target="_blank" rel="noopener">${esc(t('osm'))}</a></p>` : ''}
              </div>
            </div>
          </section>
          <section aria-labelledby="h-src"><h2 id="h-src">${esc(t('sources'))}</h2><ol class="sources">${ex.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ol></section>
        </div>
        <aside class="ex-side">
          <section style="margin-top:0" aria-labelledby="h-facts"><h2 id="h-facts" class="sr-only">${esc(t('facts'))}</h2>
            <dl class="mek-facts">${ex.facts.map((f) => `<div class="mek-fact"><dt>${esc(L(f.label))}</dt><dd>${esc(L(f.value))}<small>${esc(L(f.note))}</small></dd></div>`).join('')}</dl></section>
          <section aria-labelledby="h-parts"><h2 id="h-parts">${esc(t('partsH'))}</h2>
            <p class="muted small" style="margin:0 0 var(--space-3)">${esc(t('partsHint'))}</p>
            <ol class="parts">${parts.map((p, i) => `<li><button type="button" data-i="${i}"><span class="num">${p.n}</span><span>${esc(L(p.name))}<small>${esc(L(p.term))}</small></span></button></li>`).join('')}</ol></section>
        </aside>
      </div>
    </div>
    <div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
      <section class="mek-sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle">
        <div class="mek-sheet__grip"></div>
        <button class="icon-btn sheet-close" id="sheetClose" type="button" aria-label="${esc(t('close'))}">${ICON.close}</button>
        <div id="sheetBody"></div>
      </section>
    </div>`;

    mv = document.getElementById('mv');
    const playBtn = document.getElementById('playBtn');
    const syncPlay = () => { if (!playBtn) return; playBtn.innerHTML = playing ? ICON.pause : ICON.play; playBtn.setAttribute('aria-label', playing ? t('pause') : t('play')); };
    if (playBtn) playBtn.addEventListener('click', () => { playing = !playing; if (playing) { setAnatomy(false); mv.play(); } else mv.pause(); syncPlay(); });
    main.querySelectorAll('[data-anim]').forEach((b) => b.addEventListener('click', () => {
      anim = b.dataset.anim; mv.animationName = anim; playing = true; setAnatomy(false); mv.play(); syncPlay();
      main.querySelectorAll('[data-anim]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    }));
    document.getElementById('anatomyBtn').addEventListener('click', () => setAnatomy(!anatomyOn));
    mv.addEventListener('click', (e) => { const h = e.target.closest('.mek-hotspot'); if (h) openPart(+h.dataset.i); });
    main.querySelectorAll('.parts button').forEach((b) => b.addEventListener('click', () => { setAnatomy(true); openPart(+b.dataset.i); }));
    document.getElementById('sheetClose').addEventListener('click', closePart);
    const arBtn = document.getElementById('arBtn'), arNote = document.getElementById('arNote');
    const arState = () => { const ok = !!mv.canActivateAR; arBtn.disabled = !ok; arNote.textContent = ok ? t('arYes') : t('arNo'); };
    mv.addEventListener('load', () => { arState(); if (anatomyOn) setAnatomy(true); else if (playing && ex.animations.length) mv.play(); });
    arBtn.addEventListener('click', () => { try { mv.activateAR(); } catch (e) { arNote.textContent = t('arNo'); } });
    arState(); syncPlay();
    if (active >= 0) openPart(active, true);
  }

  function setAnatomy(on) {
    anatomyOn = on;
    const btn = document.getElementById('anatomyBtn'); if (btn) btn.setAttribute('aria-pressed', on);
    if (!mv) return;
    mv.classList.toggle('anatomy', on);
    if (on) {
      mv.pause(); try { mv.currentTime = 0; } catch (e) { }
      mv.autoRotate = false;
      if (active < 0) { mv.cameraTarget = 'auto auto auto'; mv.cameraOrbit = ex.anatomyOrbit; }
    } else { closePart(); if (ex.animations.length) { if (playing) mv.play(); } else mv.autoRotate = true; }
  }

  function openPart(i, silent) {
    const parts = ex.parts; if (i < 0 || i >= parts.length) return;
    if (!anatomyOn) setAnatomy(true);
    active = i; const p = parts[i];
    mv.querySelectorAll('.mek-hotspot').forEach((h) => h.classList.toggle('is-active', +h.dataset.i === i));
    document.querySelectorAll('.parts button').forEach((b) => b.setAttribute('aria-current', +b.dataset.i === i));
    mv.cameraTarget = `${p.position[0]}m ${p.position[1]}m ${p.position[2]}m`;
    const [nx, ny, nz] = p.normal;
    mv.cameraOrbit = ny > 0.7 ? `25deg 52deg ${ex.partRadius}` : `${Math.round(Math.atan2(nx, nz) * 180 / Math.PI)}deg 78deg ${ex.partRadius}`;
    const prev = parts[i - 1], next = parts[i + 1];
    document.getElementById('sheetBody').innerHTML = `
      <div class="mek-sheet__head"><span class="mek-sheet__num">${p.n}</span><div><h3 class="mek-sheet__title" id="sheetTitle" tabindex="-1">${esc(L(p.name))}</h3><p class="mek-sheet__sub">${esc(L(p.term))}</p></div></div>
      <p class="mek-sheet__body">${esc(L(p.desc))}</p>
      <dl class="mek-sheet__fn"><dt>${esc(t('fn'))}</dt><dd>${esc(L(p.fn))}</dd></dl>
      <div class="mek-sheet__nav">
        <button class="mek-btn mek-btn--ghost" type="button" data-go="${i - 1}" ${prev ? '' : 'disabled'}>← ${prev ? esc(L(prev.name)) : esc(t('prev'))}</button>
        <button class="mek-btn mek-btn--ghost" type="button" data-go="${i + 1}" ${next ? '' : 'disabled'}>${next ? esc(L(next.name)) : esc(t('next'))} →</button>
      </div>`;
    document.querySelectorAll('#sheetBody [data-go]').forEach((b) => b.addEventListener('click', () => openPart(+b.dataset.go)));
    const w = document.getElementById('sheetWrap'); w.classList.add('open'); w.setAttribute('aria-hidden', 'false');
    if (window.matchMedia('(max-width: 959px)').matches) document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (!silent) document.getElementById('sheetTitle').focus({ preventScroll: true });
  }

  function closePart() {
    active = -1;
    const w = document.getElementById('sheetWrap'); if (!w) return;
    w.classList.remove('open'); w.setAttribute('aria-hidden', 'true');
    if (mv) { mv.querySelectorAll('.mek-hotspot').forEach((h) => h.classList.remove('is-active')); mv.cameraTarget = 'auto auto auto'; mv.cameraOrbit = anatomyOn ? ex.anatomyOrbit : ex.orbit; }
    document.querySelectorAll('.parts button').forEach((b) => b.removeAttribute('aria-current'));
  }

  document.addEventListener('keydown', (e) => {
    if (!route()) return;
    if (e.key === 'Escape') closePart();
    if (active >= 0 && e.key === 'ArrowRight') openPart(active + 1);
    if (active >= 0 && e.key === 'ArrowLeft') openPart(active - 1);
  });

  // ---------------------------------------------------------------- home
  function renderHome() {
    document.title = 'Museum Explorer Karlsruhe'; currentId = null; mv = null;
    const M = DATA.museum;
    document.getElementById('main').innerHTML = `
    <div class="wrap">
      <section class="hero" style="margin-top:0">
        <p class="eyebrow">${esc(L(M.name))} · AR / GIS</p>
        <h1>${esc(t('heroH'))}</h1>
        <p>${esc(t('heroP'))}</p>
      </section>
      <section aria-labelledby="h-ex"><h2 id="h-ex">${esc(t('exhibitsH'))}</h2>
        <div class="ex-list">${DATA.exhibits.map((e) => `
          <a class="ex-card${e.hero ? ' hero-card' : ''}" href="#${e.id}">
            <div><p class="eyebrow">${esc(L(e.eyebrow))}</p><h3>${esc(L(e.name))}</h3><p class="sci">${esc(e.sci)}</p></div>
            <div class="foot"><span class="mek-tag mek-tag--era">${esc(L(e.era))}</span><span class="mek-tag mek-tag--id">${e.id}</span></div>
          </a>`).join('')}</div></section>
      <section aria-labelledby="h-how"><h2 id="h-how">${esc(t('howH'))}</h2>
        <ol class="steps">${t('how').map(([h, p]) => `<li><b>${esc(h)}</b>${esc(p)}</li>`).join('')}</ol></section>
      <section aria-labelledby="h-map"><h2 id="h-map">${esc(t('mapH'))}</h2>
        <div class="maps"><div class="map-card"><div class="map">${MAPS.atlantic}</div></div><div class="map-card"><div class="map">${MAPS.europe}</div></div></div>
        <p class="muted small">${esc(t('mapCap'))}</p></section>
    </div>`;
  }

  function render() {
    document.documentElement.lang = lang;
    header();
    document.getElementById('foot').innerHTML = `<div class="wrap"><span>${esc(t('about'))}</span><span><a href="#home">${esc(t('home'))}</a></span></div>`;
    const id = route();
    if (id) renderExhibit(id); else renderHome();
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', render);
  render();
})();

</script>
