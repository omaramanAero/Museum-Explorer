<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR exhibit cards · Museum Explorer Karlsruhe</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/mek.css">
<script src="vendor/qrcode.js"></script>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  .bar { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }
  .bar h1 { font: 600 32px/38px var(--font-display); margin: 0 0 8px; }
  .bar p { margin: 0 0 12px; color: var(--ink-muted); }
  .bar label { display: block; font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 16px 0 4px; }
  .bar input { width: 100%; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font: 500 14px/20px var(--font-mono); background: var(--surface); color: var(--ink); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .sheet { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; justify-items: center; }
  .a6 { width: 148mm; height: 105mm; display: flex; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  .a6 .mek-card { max-width: none; border-radius: 0; height: 100%; padding: 9mm; background: #fbf8f2; align-content: space-between; }
  .a6 .mek-card__title { font-size: 30px; line-height: 34px; }
  .a6 .mek-card__qr { width: 34mm; height: 34mm; padding: 2mm; }
  .a6 .mek-card__id span:last-child { overflow-wrap: anywhere; text-align: right; max-width: 70%; }
  @media print {
    @page { size: A6 landscape; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .sheet { padding: 0; gap: 0; max-width: none; }
    .a6 { box-shadow: none; break-after: page; }
  }
</style>
</head>
<body class="mek-root" data-theme="light">
  <div class="bar">
    <h1>QR exhibit cards</h1>
    <p>One A6 card per exhibit. Each QR code opens that exhibit under the address below (the exhibit ID follows a #). Print A6 landscape, no margins, 100% scale; codes at least 30 mm wide.</p>
    <label for="base">Site address encoded in the QR codes</label>
    <input id="base" spellcheck="false">
    <div class="row">
      <button class="mek-btn mek-btn--primary" type="button" onclick="window.print()">Print cards</button>
      <a class="mek-btn mek-btn--secondary" href="index.html">Back to the site</a>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
<script>
(() => {
  const input = document.getElementById('base');
  const q = new URLSearchParams(location.search).get('base');
  const here = location.href.replace(/[#?].*$/, '').replace(/cards\.html$/, '');
  input.value = q || here;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let data;
  function qrSvg(text) {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }
  function draw() {
    let base = input.value.trim();
    document.getElementById('sheet').innerHTML = data.exhibits.map((e) => {
      const url = `${base}#${e.id}`;
      return `<div class="a6"><article class="mek-card">
        <div>
          <p class="mek-card__eyebrow">Naturkundemuseum Karlsruhe · ${esc(e.eyebrow.de)}</p>
          <h2 class="mek-card__title">${esc(e.name.de === e.name.en ? e.name.en : e.name.en + ' / ' + e.name.de)}</h2>
          <p class="mek-card__sci"><i>${esc(e.sci)}</i> · ${esc(e.era.en)}</p>
          <p class="mek-card__cta">Scan for 3D, anatomy &amp; AR<span>Scannen für 3D, Anatomie &amp; AR</span></p>
        </div>
        <div class="mek-card__qr" role="img" aria-label="QR code for ${esc(url)}">${qrSvg(url)}</div>
        <div class="mek-card__id"><span>${e.id}</span><span>${esc(url.replace(/^https?:\/\//, ''))}</span></div>
      </article></div>`;
    }).join('');
  }
  fetch('exhibits.json').then((r) => r.json()).then((d) => { data = d; draw(); });
  input.addEventListener('input', () => data && draw());
})();
</script>
</body>
</html>
