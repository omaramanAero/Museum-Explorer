<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR exhibit cards · Museum Explorer Karlsruhe</title>
<style>
  :root { 
    --paper: #fbf8f2; 
    --ink: #1a1917; 
    --ink-muted: #66635c;
    --surface: #ffffff;
    --line: #dcd7ce;
    --radius-sm: 6px;
    --font-sans: system-ui, -apple-system, sans-serif;
    --font-display: Georgia, serif;
    --font-mono: monospace;
    color-scheme: light; 
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  .bar { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }
  .bar h1 { font: 600 32px/38px var(--font-display); margin: 0 0 8px; }
  .bar p { margin: 0 0 12px; color: var(--ink-muted); }
  .bar label { display: block; font: 600 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 16px 0 4px; }
  .bar input { width: 100%; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font: 500 14px/20px var(--font-mono); background: var(--surface); color: var(--ink); box-sizing: border-box; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .mek-btn { padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; border: none; }
  .mek-btn--primary { background: #1a1917; color: #fff; }
  .mek-btn--secondary { background: #e6e2d8; color: #1a1917; }
  .sheet { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; justify-items: center; }
  .a6 { width: 148mm; height: 105mm; display: flex; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.12); box-sizing: border-box; }
  .mek-card { width: 100%; max-width: none; border-radius: 0; height: 100%; padding: 9mm; background: #fbf8f2; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
  .mek-card__eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin: 0 0 4px; }
  .mek-card__title { font-family: Georgia, serif; font-size: 26px; line-height: 30px; margin: 0 0 4px; }
  .mek-card__sci { font-size: 14px; color: #444; margin: 0 0 8px; }
  .mek-card__cta { font-size: 13px; font-weight: 600; margin: 0; }
  .mek-card__cta span { display: block; font-weight: normal; font-size: 12px; color: #666; }
  .mek-card__qr { width: 34mm; height: 34mm; padding: 2mm; background: #fff; margin: auto 0; }
  .mek-card__qr svg { width: 100% !important; height: 100% !important; display: block; }
  .mek-card__id { display: flex; justify-content: space-between; font-size: 12px; font-family: monospace; color: #555; border-top: 1px solid #dcd7ce; padding-top: 6px; }
  .mek-card__id span:last-child { overflow-wrap: anywhere; text-align: right; max-width: 70%; }
  @media print {
    @page { size: A6 landscape; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .sheet { padding: 0; gap: 0; max-width: none; }
    .a6 { box-shadow: none; break-after: page; page-break-after: always; }
  }
</style>

<body class="mek-root" data-theme="light">
  <div class="bar">
    <h1>QR exhibit cards</h1>
    <p>One A6 card per exhibit. Each QR code opens that exhibit under the address below (the exhibit ID follows a #). Print A6 landscape, no margins, 100% scale; codes at least 30 mm wide.</p>
    <label for="base">Site address encoded in the QR codes</label>
    <input id="base" spellcheck="false">
    <div class="row">
      <button class="mek-btn mek-btn--primary" type="button" onclick="window.print()">Print cards</button>
      <a class="mek-btn mek-btn--secondary" href="index.html">Back to the site</a>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
<script>
(() => {
  const input = document.getElementById('base');
  const q = new URLSearchParams(location.search).get('base');
  const here = location.href.replace(/[#?].*$/, '').replace(/cards\.html$/, '');
  input.value = q || here;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  
  const data = {
    "exhibits": [
      {
        "id": "EX01",
        "name": { "en": "Quetzalcoatlus", "de": "Quetzalcoatlus" },
        "sci": "Quetzalcoatlus northropi",
        "eyebrow": { "en": "Giant pterosaur", "de": "Riesenflugsaurier" },
        "era": { "en": "Late Cretaceous · ~68 Ma", "de": "Oberkreide · ~68 Mio. J." }
      },
      {
        "id": "EX02",
        "name": { "en": "Three-toed horse", "de": "Dreizehiges Urpferd" },
        "sci": "Hippotherium primigenium",
        "eyebrow": { "en": "Höwenegg fossil · mounted skeleton", "de": "Höwenegg-Fossil · montiertes Skelett" },
        "era": { "en": "Late Miocene · 10.3 Ma", "de": "Obermiozän · 10,3 Mio. J." }
      },
      {
        "id": "EX03",
        "name": { "en": "North Atlantic right whale", "de": "Nordkaper" },
        "sci": "Eubalaena glacialis",
        "eyebrow": { "en": "Skeleton · largest object in the museum", "de": "Skelett · größtes Schauobjekt" },
        "era": { "en": "Living species · critically endangered", "de": "Lebende Art · vom Aussterben bedroht" }
      }
    ]
  };

  function qrSvg(text) {
    const q = qrcode(0, 'M'); 
    q.addData(text); 
    q.make();
    return q.createSvgTag(4, 2);
  }

  function draw() {
    let base = input.value.trim();
    document.getElementById('sheet').innerHTML = data.exhibits.map((e) => {
      const url = `${base}#${e.id}`;
      return `<div class="a6"><article class="mek-card">
        <div>
          <p class="mek-card__eyebrow">Naturkundemuseum Karlsruhe · ${esc(e.eyebrow.de)}</p>
          <h2 class="mek-card__title">${esc(e.name.de === e.name.en ? e.name.en : e.name.en + ' / ' + e.name.de)}</h2>
          <p class="mek-card__sci"><i>${esc(e.sci)}</i> · ${esc(e.era.en)}</p>
          <p class="mek-card__cta">Scan for 3D, anatomy &amp; AR<span>Scannen für 3D, Anatomie &amp; AR</span></p>
        </div>
        <div class="mek-card__qr" role="img" aria-label="QR code for ${esc(url)}">${qrSvg(url)}</div>
        <div class="mek-card__id"><span>${e.id}</span><span>${esc(url.replace(/^https?:\/\//, ''))}</span></div>
      </article></div>`;
    }).join('');
  }

  draw();
  input.addEventListener('input', () => draw());
})();
</script>
</body>
</html>
